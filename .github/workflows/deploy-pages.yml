name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets an admin trigger a redeploy manually without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # GitHub Pages serves this repo at /<repo-name>/, not the domain root.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Public Supabase URL + anon (publishable) key - safe to expose
          # client-side, access is enforced by RLS (see
          # supabase/migrations/0002_auth_roles.sql), not by key secrecy.
          # Set these under Settings -> Secrets and variables -> Actions ->
          # Variables. Leaving them unset builds the app in local/mock mode.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
